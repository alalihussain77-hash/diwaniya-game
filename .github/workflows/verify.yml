name: Verify game changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install locked dependencies
        shell: bash
        run: |
          set -o pipefail
          node --version
          npm --version
          for attempt in 1 2 3; do
            echo "Dependency installation attempt $attempt of 3"
            if npm ci --no-audit --no-fund --fetch-retries=5; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "npm ci failed after three attempts. npm logs:"
              find "$HOME/.npm/_logs" -maxdepth 1 -type f -name '*debug-0.log' -print -exec tail -n 100 {} \; || true
              exit 1
            fi
            rm -rf node_modules
            sleep 5
          done
      - name: Typecheck
        run: npm run lint
      - name: Build
        run: npm run build

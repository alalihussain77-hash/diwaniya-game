name: Verify game changes

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out game
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
      - name: Install project dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm run lint
      - name: Build
        run: pnpm run build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Smoke test game in browser
        run: |
          export CHROMIUM_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          pnpm run test:smoke
